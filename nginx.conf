# Map block to handle WebSocket 'Upgrade' header correctly
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 10000;
    server_name _;

    # Increase timeouts so the SSH session doesn't close during idle time
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Disable buffering for real-time terminal data
        proxy_buffering off;
        
        # Bypass cache for WebSockets
        proxy_cache_bypass $http_upgrade;
    }
}
